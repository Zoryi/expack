<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mountGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#065f73"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mountGrad3" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="#0f172a"/>

  <!-- Far mountain (left) -->
  <polygon points="30,420 160,170 290,420" fill="url(#mountGrad3)" opacity="0.4"/>

  <!-- Mid mountain (right) -->
  <polygon points="220,420 380,190 530,420" fill="url(#mountGrad2)" opacity="0.6"/>

  <!-- Main mountain (center, front) -->
  <polygon points="140,420 300,100 460,420" fill="url(#mountGrad)"/>

  <!-- Snow cap on main peak -->
  <polygon points="300,100 272,175 300,168 328,175" fill="#ffffff" opacity="0.95"/>

  <!-- Snow streaks -->
  <path d="M 272 175 L 260 220 L 275 210 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M 328 175 L 340 220 L 325 210 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Backpack icon - stylized at the base-center -->
  <g transform="translate(222, 320)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main pack body -->
    <rect x="0" y="10" width="68" height="80" rx="10"/>
    <!-- Pack lid/flap -->
    <path d="M 4 20 Q 34 -2 64 20"/>
    <!-- Center vertical (compression strap) -->
    <line x1="34" y1="20" x2="34" y2="85"/>
    <!-- Left pocket -->
    <rect x="-10" y="30" width="14" height="45" rx="4"/>
    <!-- Right pocket -->
    <rect x="64" y="30" width="14" height="45" rx="4"/>
    <!-- Top handle -->
    <path d="M 22 8 Q 34 -8 46 8"/>
  </g>

  <!-- Small trail path connecting to the mountain -->
  <path d="M 290 340 Q 300 310 310 340" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
